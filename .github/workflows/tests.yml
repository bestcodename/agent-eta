name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The Python suite also executes the widget's node:test cases.
      # Install Node explicitly so UI regressions cannot silently skip in CI.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unit tests
        run: python3 -m unittest discover -s . -v

      - name: Widget tests
        run: node --test --test-isolation=none test_plasmoid.mjs

      - name: Syntax check
        run: |
          python3 -m py_compile agent-eta agent_eta_*.py
          bash -n install.sh

      - name: Lint the installer
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck install.sh

  # The widget's QML runs against the real Plasma 6 and Kirigami modules, which Ubuntu runners lack.
  qml:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt Quick Test and the Plasma 6 QML modules
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends python3 \
            qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-org-kde-kirigami qml6-module-org-kde-plasma-plasma5support plasma-workspace plasma-desktoptheme

      # The binary check keeps a missing runner from turning into a silent skip.
      - name: Widget QML tests
        run: |
          test -x /usr/lib/qt6/bin/qmltestrunner
          python3 -m unittest -v test_qml
