# agent-eta's private tmux server loads only this file, never ~/.tmux.conf. See docs/agent-eta.md.
set -g mouse on
set -g history-limit 50000
# Window names are runtime record IDs, so the status line shows each agent's terminal title,
# or its working directory while the title is still tmux's default host name.
set -g window-status-format '#I:#{?#{==:#{pane_title},#{host}},#{b:pane_current_path},#{=/40/…:pane_title}}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#{?#{==:#{pane_title},#{host}},#{b:pane_current_path},#{=/40/…:pane_title}}#{?window_flags,#{window_flags}, }'
